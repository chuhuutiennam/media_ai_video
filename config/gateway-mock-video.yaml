# Manual video lab profile. The E2E script generates its own isolated config.
gateway:
  id: gw-video-lab
  raw_rtp_enabled: true
  webrtc_enabled: false
  mock_result_pump: false
server:
  http_addr: '127.0.0.1:8081'
  public_url: 'http://127.0.0.1:8081'
rtp:
  listen_addr: '127.0.0.1:5006'
  bind_ip: '127.0.0.1'
  public_ip: '127.0.0.1'
  port_start: 41000
  port_end: 41099
session:
  max_sessions: 20
  idle_timeout_sec: 60
  per_session_packet_queue: 1024
pipeline:
  jitter_out_queue_size: 1024
ai:
  grpc_target: '127.0.0.1:50051' # audio mock, when testing audio + video
video:
  enabled: true
  jitter:                         # jitter riêng cho RTP video (mặc định bật, xem gateway-video-ims.yaml);
    enabled: true                 # session.per_session_packet_queue/pipeline.* ở trên chỉ còn cho audio
  worker_count: 2
  job_queue_size: 1024
  infer_width: 256
  infer_height: 256
  infer_fps: 5
  frame_queue_size: 8
  jpeg_quality: 80
  default_effect_type: bg_replace
  ai:
    grpc_target: '127.0.0.1:50051'
    max_active_streams: 20
    max_retry: 0
log:
  level: debug
