# One source stream per leg -> video-ai-engine -> independent model workers.
# See docs/video-engine-fanout.md for the engine command and E2E runner.
gateway:
  id: gw-video-engine
  raw_rtp_enabled: true
  webrtc_enabled: false
  mock_result_pump: false
server:
  http_addr: '127.0.0.1:8081'
  public_url: 'http://127.0.0.1:8081'
rtp:
  listen_addr: '127.0.0.1:0'
  bind_ip: '127.0.0.1'
  public_ip: '127.0.0.1'
  port_start: 41000
  port_end: 41099
session:
  max_sessions: 20
  idle_timeout_sec: 600
  per_session_packet_queue: 1024
pipeline:
  jitter_out_queue_size: 1024
ai:
  grpc_target: ''
  keepalive_time_sec: 30
  keepalive_timeout_sec: 10
video:
  enabled: true
  worker_count: 2
  infer_width: 256
  infer_height: 256
  infer_fps: 5
  frame_queue_size: 3
  jpeg_quality: 80
  default_effect_type: bg_replace
  gesture:
    enabled: true
    infer_fps: 15
    max_dimension: 640
    max_hands: 4
  ai:
    engine_target: '127.0.0.1:50054'
    source_max_dimension: 640
    max_active_streams: 40
    open_timeout_ms: 5000
    send_timeout_ms: 5000
    max_retry: 3
log:
  level: info
