# Danh mục dịch vụ video: mỗi selectedService ↔ đúng một AI service riêng.
# Xem docs/giai-phap-video-service-catalog.md.
#   change_background → repo mediapipe (segmentation) :50052
#   video_effects     → repo gesture (gesture)        :50053
# Lab không có AI thật: dùng 2 tiến trình mock-ai-worker trên 2 cổng này.
# Không được kết hợp video.services với video.ai.workers / grpc_target / engine_target / video.gesture.enabled.
# Thông số AI nằm trong dịch vụ dùng nó (segmentation / gesture); video.gesture, video.infer_*,
# video.default_effect_type bị từ chối khi có video.services.
gateway:
  id: gw-video-services
  raw_rtp_enabled: true
  webrtc_enabled: false
  mock_result_pump: false
server:
  http_addr: '127.0.0.1:8081'
  public_url: 'http://127.0.0.1:8081'
rtp:
  listen_addr: '127.0.0.1:5006'
  bind_ip: '127.0.0.1'
  public_ip: '127.0.0.1'
  port_start: 41000
  port_end: 41099
  port_reuse_delay_ms: 5000  # (mặc định) cổng vừa trả chờ 5s mới cấp lại; 0 = tắt
session:
  max_sessions: 20
  idle_timeout_sec: 600
  per_session_packet_queue: 1024
pipeline:
  jitter_out_queue_size: 1024
audio:
  enabled: false                  # gateway chỉ video: ANSWER speech_to_text/realtime_translation → 400
ai:
  grpc_target: ''
  watch_reconnect: true           # nối lại ngay khi AI của dịch vụ restart
  reconnect_max_backoff_ms: 5000  # AI sống lại → gateway nối lại trong <= ~5s
video:
  enabled: true
  jitter:                         # jitter riêng cho RTP video (mặc định bật, xem gateway-video-ims.yaml);
    enabled: true                 # session.per_session_packet_queue/pipeline.* ở trên chỉ còn cho audio
  worker_count: 2
  job_queue_size: 1024
  frame_queue_size: 8             # chung mọi dịch vụ
  jpeg_quality: 80                # chung mọi dịch vụ
  ai:
    max_active_streams: 40        # giới hạn mặc định mỗi target khi services.*.ai.max_streams = 0
    max_retry: 3                  # AI lỗi giữa cuộc gọi (kể cả worker restart) → mở lại, chọn lại target; tối đa 3 lần lỗi liên tiếp, 0 = không mở lại
    failover: true                # (mặc định) bỏ qua target đang lỗi kết nối; mở stream lỗi thì thử target khác cùng dịch vụ
    readiness_requires_ai: false  # (mặc định) true: /health/ready 503 khi một dịch vụ đang bật không còn target kết nối được
    open_timeout_ms: 5000         # (mặc định) hạn chờ mở stream AI khi ANSWER; 0 = không giới hạn; số leg × giá trị này < server.write_timeout_sec (mặc định 10)
  services:
    change_background:
      enabled: true
      legs: tcore                 # tcore (mặc định) | both
      effect_type: bg_replace
      segmentation:               # thông số AI segmentation; bỏ trống/0 = mặc định code (5 fps, 256x256)
        infer_fps: 5
        infer_width: 256
        infer_height: 256
      ai:
        task: video_segment       # AI segmentation (repo mediapipe)
        targets: ['127.0.0.1:50052']
        max_streams: 8
    video_effects:
      enabled: true
      legs: tcore
      gesture:                    # thông số AI gesture; bỏ trống/0 = mặc định code (15 fps, 640, 4 tay, hàng đợi 2)
        infer_fps: 15
        max_dimension: 640
        max_hands: 4
        frame_queue_size: 8
      ai:
        task: gesture_recognition # AI gesture (repo gesture), khác AI của change_background
        targets: ['127.0.0.1:50053']
        max_streams: 4
log:
  level: debug
